name = "lsda-hubbard"
version = "0.1.0"
license = "MIT"
author = "Guilherme Canella"
maintainer = "guycanella@gmail.com"
copyright = "2025 Guilherme Canella"

[build]
auto-executables = true
# Every test is listed explicitly in the [[test]] blocks below so that the
# test inventory is auditable; do not re-enable auto discovery.
auto-tests = false
auto-examples = true
link = ["lapack", "blas"]

[library]
source-dir = "src"

[install]
library = true

# ============================================
# Executables
# ============================================

[[executable]]
name = "lsdaks"
source-dir = "app"
main = "main.f90"

[[executable]]
name = "convert_tables"
source-dir = "app"
main = "convert_tables.f90"

[[executable]]
name = "generate_xc_table"
source-dir = "app"
main = "generate_table.f90"

# ============================================
# Tests
#
# All 20 test programs in test/ are listed here explicitly (auto-tests is off).
# When adding a test file, add a matching [[test]] block.
# ============================================

[[test]]
name = "test_adaptive_mixing"
source-dir = "test"
main = "test_adaptive_mixing.f90"

