# ============================================
# OpenMP
#
# The XC table generator parallelises its density rows (the only !$OMP
# directives in the code base live in src/bethe_ansatz/bethe_tables.f90), which
# takes the default 75 x 202 grid at U = 4 from 306 s to 49 s (measured, 14
# threads).  It cannot be switched on
# from here: fpm 0.12.0 (alpha) parses a `[profiles.<name>.gfortran]` table and
# then ignores its `flags`, and `link-time-flags` makes it abort with SIGABRT.
# Verified on a minimal one-module project as well, so it is not a quirk of
# this manifest.  Use the command line instead - it prepends to the profile
# defaults, so no optimisation flag is lost:
#
#   fpm build --profile release --flag "-O3 -march=native -fopenmp" \
#             --link-flag "-fopenmp"
#
# Re-check `fpm build --profile release --verbose` (the COMPILER OPTIONS line)
# after any fpm upgrade; once profiles work, move the flags here.
# ============================================

# ============================================
# Dependencies
# ============================================

[dependencies]

[dev-dependencies]
fortuno = { git = "https://github.com/fortuno-repos/fortuno-fpm-serial.git" }
